<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trippy Run | Cyber Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@300;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon-fuchsia: #f0f; --neon-aqua: #0ff; }
        body { margin: 0; overflow: hidden; background: #050005; font-family: 'Rajdhani', sans-serif; color: #fff; }
        
        /* UI HUD Styling */
        #ui-layer { position: absolute; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .glass-hud { background: rgba(10, 0, 15, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 0, 255, 0.2); }
        
        #hud-top { position: absolute; top: 80px; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; }
        .stat-box { padding: 10px 20px; border-left: 3px solid var(--neon-fuchsia); }
        .stat-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--neon-fuchsia); letter-spacing: 2px; }
        .stat-value { font-family: 'Orbitron', sans-serif; font-size: 24px; text-shadow: 0 0 15px var(--neon-fuchsia); }

        /* Menu Screens */
        .overlay-screen { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 40px; text-align: center; pointer-events: auto; width: 400px;
        }
        
        h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 8px; font-size: 3rem; margin-bottom: 0.5rem; }
        .glitch-text { text-shadow: 2px 0 var(--neon-fuchsia), -2px 0 var(--neon-aqua); animation: glitch 2s infinite linear alternate-reverse; }

        @keyframes glitch {
            0% { text-shadow: 2px 0 var(--neon-fuchsia), -2px 0 var(--neon-aqua); }
            100% { text-shadow: -2px 0 var(--neon-fuchsia), 2px 0 var(--neon-aqua); }
        }

        .btn-cyber {
            margin-top: 30px; padding: 15px 40px; background: transparent; 
            border: 1px solid var(--neon-aqua); color: var(--neon-aqua);
            font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold;
            transition: all 0.3s; cursor: pointer; letter-spacing: 2px;
        }
        .btn-cyber:hover { background: var(--neon-aqua); color: #000; box-shadow: 0 0 30px var(--neon-aqua); }

        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
        
        /* Game Effects */
        .hit-flash { animation: flash 0.2s; }
        @keyframes flash { 0% { background: #f00; } 100% { background: transparent; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body id="game-body">

    <script src="nav.js"></script>

    <div id="ui-layer">
        <div id="hud-top">
            <div class="glass-hud stat-box">
                <div class="stat-label uppercase">Velocity</div>
                <div class="stat-value"><span id="speed-disp">100</span> <span class="text-xs text-gray-500">KM/H</span></div>
            </div>
            <div class="glass-hud stat-box" style="border-color: var(--neon-aqua);">
                <div class="stat-label uppercase" style="color: var(--neon-aqua);">Neural Sync</div>
                <div class="stat-value" style="color: var(--neon-aqua); text-shadow: 0 0 15px var(--neon-aqua);"><span id="score">0</span>%</div>
            </div>
        </div>

        <div id="start-screen" class="glass-hud overlay-screen">
            <h1 class="glitch-text text-white">TRIPPY RUN</h1>
            <p class="text-xs text-fuchsia-500 font-mono tracking-widest mt-2 uppercase">Neural Link Required</p>
            <button class="btn-cyber" onclick="startGame()">INITIATE_SYNC</button>
        </div>

        <div id="game-over" class="glass-hud overlay-screen" style="display: none; border-color: #f00;">
            <h1 class="text-red-600 glitch-text">DESYNCED</h1>
            <p id="final-score" class="font-mono text-gray-400 mt-4">FINAL_SIGNAL: 0%</p>
            <button class="btn-cyber" style="border-color:#f00; color:#f00;" onclick="location.reload()">RE-LINK_SIGNAL</button>
        </div>
    </div>

    <script>
        let isActive = false;
        let score = 0, speed = 45;
        const BPM = 135, BEAT_TIME = 60 / BPM;
        let beatTimer = 0, lane = 0;
        const LANE_WIDTH = 4.5;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050005, 0.045);

        const camera = new THREE.PerspectiveCamera(100, window.innerWidth/window.innerHeight, 0.1, 250);
        camera.position.set(0, 1.8, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Optimized Tunnel
        const rings = [];
        const ringGeo = new THREE.OctahedronGeometry(10, 0); 
        for(let i=0; i<50; i++) {
            const ringMat = new THREE.MeshBasicMaterial({ 
                color: i % 2 === 0 ? 0xff00ff : 0x00ffff, 
                wireframe: true, transparent: true, opacity: 0.3 
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.z = -i * 4;
            ring.rotation.z = i * 0.15;
            scene.add(ring);
            rings.push(ring);
        }

        // Starfield background
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(3000);
        for(let i=0; i<3000; i++) starPos[i] = (Math.random()-0.5) * 400;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0x555555, size: 0.5})));

        // Player Unit
        const player = new THREE.Mesh(
            new THREE.TetrahedronGeometry(0.7), 
            new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true })
        );
        player.position.y = 0.5;
        scene.add(player);

        const obstacles = [];
        const obsGeo = new THREE.IcosahedronGeometry(1.2, 0);
        const obsMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });

        window.startGame = function() {
            document.getElementById('start-screen').style.display = 'none';
            isActive = true;
        };

        window.addEventListener('keydown', (e) => {
            if(!isActive) return;
            if((e.key === 'ArrowLeft' || e.key === 'a') && lane > -1) lane--;
            if((e.key === 'ArrowRight' || e.key === 'd') && lane < 1) lane++;
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);

            if(isActive) {
                beatTimer += dt;
                if(beatTimer >= BEAT_TIME) {
                    beatTimer -= BEAT_TIME;
                    score++;
                    speed += 0.4;
                    document.getElementById('score').innerText = score;
                    document.getElementById('speed-disp').innerText = Math.floor(speed * 2.2);
                    
                    // Pulse Effect
                    rings.forEach(r => { r.scale.setScalar(1.1); setTimeout(() => r.scale.setScalar(1.0), 100); });

                    // Spawn Obstacle
                    const o = new THREE.Mesh(obsGeo, obsMat);
                    const l = Math.floor(Math.random() * 3) - 1;
                    o.position.set(l * LANE_WIDTH, 1, -180);
                    scene.add(o);
                    obstacles.push(o);
                }

                player.position.x += (lane * LANE_WIDTH - player.position.x) * 12 * dt;
                player.rotation.z += dt * 3;
                player.rotation.y += dt * 2;

                rings.forEach(r => {
                    r.position.z += speed * dt;
                    r.rotation.z += dt * 0.2;
                    if(r.position.z > 10) r.position.z = -180;
                });

                for(let i=obstacles.length-1; i>=0; i--) {
                    const o = obstacles[i];
                    o.position.z += speed * dt;
                    o.rotation.x += dt * 2;
                    
                    if(Math.abs(o.position.z - player.position.z) < 1.2 && Math.abs(o.position.x - player.position.x) < 1.5) {
                        isActive = false;
                        document.body.classList.add('hit-flash');
                        document.getElementById('game-over').style.display = 'block';
                        document.getElementById('final-score').innerText = `FINAL_SIGNAL_STRENGTH: ${score}%`;
                    }
                    if(o.position.z > 15) { scene.remove(o); obstacles.splice(i, 1); }
                }
            } else {
                rings.forEach(r => r.rotation.z += 0.005);
            }

            renderer.render(scene, camera);
        }
        
        window.onload = animate;
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
