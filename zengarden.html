<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Zen Garden | Cyber Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@300;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon-cyan: #00ffff; --neon-magenta: #ff00ff; }
        body { margin: 0; overflow: hidden; background: #020205; font-family: 'Rajdhani', sans-serif; color: white; }
        
        #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .glass-panel { pointer-events: auto; background: rgba(5, 10, 20, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0, 255, 255, 0.2); }

        /* HUD Panels */
        #hud-left { position: absolute; top: 100px; left: 30px; padding: 20px; border-l-4 border-cyan-500; }
        #tools-panel { position: absolute; top: 100px; right: 30px; padding: 20px; width: 220px; border-r-4 border-fuchsia-500; }

        .stat-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--neon-cyan); letter-spacing: 2px; opacity: 0.7; }
        .stat-value { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; text-shadow: 0 0 10px var(--neon-cyan); }

        .action-btn {
            background: rgba(0, 255, 255, 0.05); border: 1px solid rgba(0, 255, 255, 0.3);
            color: white; padding: 10px; cursor: pointer; font-family: 'Share Tech Mono', monospace;
            font-size: 11px; text-transform: uppercase; transition: 0.3s; width: 100%; margin-top: 10px;
        }
        .action-btn:hover { background: var(--neon-cyan); color: black; box-shadow: 0 0 15px var(--neon-cyan); }

        #status-tip {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 12px 25px; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #888;
        }
        #status-tip span { color: var(--neon-magenta); font-weight: bold; }

        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>

    <script src="nav.js"></script>

    <div id="ui-overlay">
        <div id="hud-left" class="glass-panel">
            <div class="stat-label uppercase">Environment</div>
            <div class="stat-value">TRANQUILITY_v1.0</div>
            <div class="stat-label uppercase mt-4">Matrix Load</div>
            <div class="text-xs font-mono text-cyan-400">NOMINAL_0.02ms</div>
        </div>

        <div id="tools-panel" class="glass-panel text-right">
            <div class="stat-label uppercase">Garden Tools</div>
            <button class="action-btn" onclick="resetSand()">Format_Sand</button>
            <button class="action-btn" onclick="randomizeRocks()">Realign_Nodes</button>
            <div class="stat-label uppercase mt-4">Aesthetics</div>
            <button class="action-btn" onclick="toggleColor()">Shift_Aura</button>
        </div>

        <div id="status-tip" class="glass-panel uppercase">
            [SYS] <span>DRAG_MOUSE</span> TO RAKE THE DIGITAL SAND &bull; <span>R-CLICK</span> TO VIEW
        </div>
    </div>

    <script>
        let scene, camera, renderer, clock;
        let sandMesh, sandCanvas, sandCtx, sandTexture;
        let rocks = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let isDrawing = false;
        let currentNeonColor = 0x00ffff;

        const GARDEN_SIZE = 100;
        const RESOLUTION = 1024;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020205);
            scene.fog = new THREE.FogExp2(0x020205, 0.005);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 85, 85);
            camera.lookAt(0, -10, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // Lighting
            scene.add(new THREE.AmbientLight(0x333333));
            const mainLight = new THREE.PointLight(0xffffff, 0.6, 500);
            mainLight.position.set(0, 100, 50);
            scene.add(mainLight);

            setupSand();
            randomizeRocks();

            window.addEventListener('mousedown', (e) => { if(e.button === 0) isDrawing = true; });
            window.addEventListener('mouseup', () => { isDrawing = false; });
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onResize);

            animate();
        }

        function setupSand() {
            sandCanvas = document.createElement('canvas');
            sandCanvas.width = RESOLUTION;
            sandCanvas.height = RESOLUTION;
            sandCtx = sandCanvas.getContext('2d');
            resetSand();

            sandTexture = new THREE.CanvasTexture(sandCanvas);
            
            const geometry = new THREE.PlaneGeometry(GARDEN_SIZE, GARDEN_SIZE, 128, 128);
            geometry.rotateX(-Math.PI / 2);

            const material = new THREE.MeshStandardMaterial({
                color: 0x11111a,
                roughness: 0.9,
                displacementMap: sandTexture,
                displacementScale: -5,
                bumpMap: sandTexture,
                bumpScale: 0.4
            });

            sandMesh = new THREE.Mesh(geometry, material);
            scene.add(sandMesh);

            const grid = new THREE.GridHelper(GARDEN_SIZE, 40, 0x00ffff, 0x050510);
            grid.position.y = -0.6;
            scene.add(grid);
        }

        function resetSand() {
            sandCtx.fillStyle = '#808080';
            sandCtx.fillRect(0, 0, RESOLUTION, RESOLUTION);
            if (sandTexture) sandTexture.needsUpdate = true;
        }

        function createRock() {
            const geo = new THREE.IcosahedronGeometry(Math.random() * 4 + 3, 0);
            const mat = new THREE.MeshStandardMaterial({
                color: 0x050505,
                emissive: currentNeonColor,
                emissiveIntensity: 0.8,
                flatShading: true
            });
            const rock = new THREE.Mesh(geo, mat);
            
            const r = Math.random() * 30 + 10;
            const theta = Math.random() * Math.PI * 2;
            rock.position.set(Math.cos(theta) * r, 0, Math.sin(theta) * r);
            rock.rotation.set(Math.random(), Math.random(), Math.random());
            
            const light = new THREE.PointLight(currentNeonColor, 2, 25);
            light.position.y = 3;
            rock.add(light);
            
            scene.add(rock);
            rocks.push(rock);
        }

        function randomizeRocks() {
            rocks.forEach(r => scene.remove(r));
            rocks = [];
            for(let i=0; i<6; i++) createRock();
        }

        function toggleColor() {
            currentNeonColor = currentNeonColor === 0x00ffff ? 0xff00ff : 0x00ffff;
            rocks.forEach(r => {
                r.material.emissive.setHex(currentNeonColor);
                r.children[0].color.setHex(currentNeonColor);
            });
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            if (isDrawing) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(sandMesh);

                if (intersects.length > 0) {
                    const pt = intersects[0].point;
                    const x = ((pt.x + GARDEN_SIZE / 2) / GARDEN_SIZE) * RESOLUTION;
                    const y = ((pt.z + GARDEN_SIZE / 2) / GARDEN_SIZE) * RESOLUTION;

                    drawRake(x, y);
                }
            }
        }

        function drawRake(x, y) {
            sandCtx.fillStyle = '#000000';
            const spacing = 7;
            for(let i=-2; i<=2; i++) {
                sandCtx.beginPath();
                sandCtx.arc(x + i * spacing, y, 3, 0, Math.PI * 2);
                sandCtx.fill();
            }
            sandTexture.needsUpdate = true;
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            rocks.forEach((r, i) => {
                r.position.y = Math.sin(time + i) * 0.4;
                r.rotation.y += 0.005;
                r.material.emissiveIntensity = 0.6 + Math.sin(time * 1.5 + i) * 0.3;
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
