<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Billiards | Cyber Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
            --glass-bg: rgba(10, 10, 15, 0.9);
        }

        body { margin: 0; overflow: hidden; background: #05050a; font-family: 'Rajdhani', sans-serif; color: white; }

        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        .glass-panel {
            pointer-events: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        /* HUD Panels */
        #hud-left { position: absolute; top: 100px; left: 30px; padding: 20px; border-l-4 border-cyan-500; }
        #hud-right { position: absolute; top: 100px; right: 30px; padding: 20px; text-align: right; border-r-4 border-fuchsia-500; }

        .stat-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--neon-cyan); letter-spacing: 2px; opacity: 0.7; }
        .stat-value { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; text-shadow: 0 0 10px var(--neon-cyan); }

        #aim-ui {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 12px 25px; font-family: 'Share Tech Mono', monospace; font-size: 11px;
            letter-spacing: 1px; color: #888;
        }
        #aim-ui span { color: var(--neon-magenta); font-weight: bold; }

        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>

    <script src="nav.js"></script>

    <div id="ui-overlay">
        <div id="hud-left" class="glass-panel w-64">
            <div class="stat-label uppercase">Engine Status</div>
            <div class="stat-value text-sm mt-1">ASTRO_PHYSICS v2.0</div>
            <div class="mt-4 border-t border-cyan-500/20 pt-2">
                <div class="stat-label uppercase">Vector Power</div>
                <div id="power-bar" class="h-1 bg-cyan-500/20 mt-1 w-full overflow-hidden">
                    <div id="power-fill" class="h-full bg-cyan-400 w-0"></div>
                </div>
            </div>
        </div>

        <div id="hud-right" class="glass-panel w-64">
            <div class="stat-label uppercase">Planets Harvested</div>
            <div id="score-val" class="stat-value">0 / 9</div>
        </div>

        <div id="aim-ui" class="glass-panel">
            [SYS] <span>DRAG_BACK</span> FROM WHITE_DWARF TO ENGAGE STRIKE &bull; <span>R-CLICK</span> TO ROTATE VIEW
        </div>
    </div>

    <script>
        const BALL_RADIUS = 3.2;
        const TABLE_W = 120, TABLE_H = 240;
        const PLANETS = [
            { name: 'Mercury', color: 0x888888 }, { name: 'Venus', color: 0xe3bb76 },
            { name: 'Earth', color: 0x2233ff }, { name: 'Mars', color: 0xff3300 },
            { name: 'Jupiter', color: 0xd39c7e }, { name: 'Saturn', color: 0xc5ab6e },
            { name: 'Uranus', color: 0xbbe1e4 }, { name: 'Neptune', color: 0x6081ff },
            { name: 'Pluto', color: 0x968370 }
        ];

        let world, scene, camera, renderer, clock;
        let balls = [], ballMeshes = [];
        let cueBall, cueMesh, aimLine;
        let isDragging = false, dragStart = new THREE.Vector3(), dragEnd = new THREE.Vector3();
        let score = 0;

        init();

        function init() {
            world = new CANNON.World();
            world.gravity.set(0, -15, 0); 
            world.broadphase = new CANNON.NaiveBroadphase();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020205);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 3000);
            camera.position.set(0, 200, 180);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // Lights
            scene.add(new THREE.AmbientLight(0xffffff, 0.3));
            const mainLight = new THREE.PointLight(0x00ffff, 1.5, 1000);
            mainLight.position.set(0, 150, 50);
            scene.add(mainLight);

            createStarfield();
            createTable();
            createBalls();
            createAimLine();

            window.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            window.addEventListener('resize', onResize);

            animate();
        }

        function createStarfield() {
            const geo = new THREE.BufferGeometry();
            const count = 2000;
            const pos = new Float32Array(count * 3);
            for(let i=0; i<count*3; i++) pos[i] = (Math.random()-0.5) * 2000;
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, transparent: true, opacity: 0.6 });
            scene.add(new THREE.Points(geo, mat));
        }

        function createTable() {
            const tableGeo = new THREE.BoxGeometry(TABLE_W, 4, TABLE_H);
            const tableMat = new THREE.MeshStandardMaterial({ 
                color: 0x0a0a15, roughness: 0.1, metalness: 0.9,
                emissive: 0x00ffff, emissiveIntensity: 0.05
            });
            const table = new THREE.Mesh(tableGeo, tableMat);
            scene.add(table);

            const floorBody = new CANNON.Body({ mass: 0 });
            floorBody.addShape(new CANNON.Plane());
            floorBody.quaternion.setFromAxisAngle(new CANNON.Vector3(1, 0, 0), -Math.PI/2);
            world.addBody(floorBody);

            // Simple rail geometry
            const railMat = new THREE.MeshStandardMaterial({ color: 0x111122, emissive: 0x00ffff, emissiveIntensity: 0.1 });
            const rails = [
                {w: TABLE_W, h: 6, x: 0, z: -TABLE_H/2-3},
                {w: TABLE_W, h: 6, x: 0, z: TABLE_H/2+3},
                {w: 6, h: TABLE_H, x: -TABLE_W/2-3, z: 0},
                {w: 6, h: TABLE_H, x: TABLE_W/2+3, z: 0}
            ];
            rails.forEach(r => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(r.w, 10, r.h), railMat);
                mesh.position.set(r.x, 5, r.z);
                scene.add(mesh);
                const body = new CANNON.Body({ mass: 0 });
                body.addShape(new CANNON.Box(new CANNON.Vector3(r.w/2, 5, r.h/2)));
                body.position.set(r.x, 5, r.z);
                world.addBody(body);
            });
        }

        function createBalls() {
            // White Dwarf
            cueMesh = new THREE.Mesh(new THREE.SphereGeometry(BALL_RADIUS, 32, 32), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1 }));
            scene.add(cueMesh);
            cueBall = new CANNON.Body({ mass: 1, shape: new CANNON.Sphere(BALL_RADIUS) });
            cueBall.position.set(0, BALL_RADIUS + 2, 60);
            cueBall.linearDamping = 0.35; cueBall.angularDamping = 0.35;
            world.addBody(cueBall);

            // Planets
            let idx = 0;
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c <= r; c++) {
                    if (idx >= PLANETS.length) break;
                    const p = PLANETS[idx];
                    const mesh = new THREE.Mesh(new THREE.SphereGeometry(BALL_RADIUS, 16, 16), new THREE.MeshStandardMaterial({ color: p.color, emissive: p.color, emissiveIntensity: 0.4, wireframe: true }));
                    scene.add(mesh);
                    const body = new CANNON.Body({ mass: 0.8, shape: new CANNON.Sphere(BALL_RADIUS) });
                    body.position.set((c - r/2) * (BALL_RADIUS * 2.1), BALL_RADIUS + 2, -60 - r * (BALL_RADIUS * 1.9));
                    body.linearDamping = 0.35; body.angularDamping = 0.35;
                    world.addBody(body);
                    balls.push(body); ballMeshes.push(mesh);
                    idx++;
                }
            }
        }

        function createAimLine() {
            aimLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xff00ff }));
            aimLine.visible = false;
            scene.add(aimLine);
        }

        function onMouseDown(e) {
            if (e.button !== 0) return;
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera({ x: (e.clientX/window.innerWidth)*2-1, y: -(e.clientY/window.innerHeight)*2+1 }, camera);
            if (raycaster.intersectObject(cueMesh).length > 0) { isDragging = true; dragStart.copy(cueMesh.position); aimLine.visible = true; }
        }

        function onMouseMove(e) {
            if (!isDragging) return;
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera({ x: (e.clientX/window.innerWidth)*2-1, y: -(e.clientY/window.innerHeight)*2+1 }, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -5);
            raycaster.ray.intersectPlane(plane, dragEnd);
            aimLine.geometry.setFromPoints([cueMesh.position, dragEnd]);
            const dist = Math.min(cueMesh.position.distanceTo(dragEnd)*5, 100);
            document.getElementById('power-fill').style.width = dist + '%';
        }

        function onMouseUp() {
            if (!isDragging) return;
            isDragging = false; aimLine.visible = false;
            const force = dragStart.clone().sub(dragEnd);
            const power = Math.min(force.length() * 2.5, 250);
            force.normalize().multiplyScalar(power);
            cueBall.applyImpulse(new CANNON.Vector3(force.x, 0, force.z), cueBall.position);
            document.getElementById('power-fill').style.width = '0%';
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function checkPockets() {
            const pockets = [[-60, 120], [60, 120], [-60, -120], [60, -120], [-60, 0], [60, 0]];
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];
                pockets.forEach(p => {
                    if (Math.hypot(b.position.x - p[0], b.position.z - p[1]) < 9) {
                        scene.remove(ballMeshes[i]); world.remove(b);
                        balls.splice(i, 1); ballMeshes.splice(i, 1);
                        score++; document.getElementById('score-val').innerText = `${score} / 9`;
                    }
                });
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            world.step(1/60);
            cueMesh.position.copy(cueBall.position);
            cueMesh.quaternion.copy(cueBall.quaternion);
            for (let i = 0; i < balls.length; i++) {
                ballMeshes[i].position.copy(balls[i].position);
                ballMeshes[i].quaternion.copy(balls[i].quaternion);
            }
            checkPockets();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
