<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System | Cyber Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@300;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon-cyan: #00ffff; --neon-magenta: #ff00ff; }
        body { margin: 0; overflow: hidden; background: #000005; font-family: 'Rajdhani', sans-serif; color: white; }
        
        #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .glass-panel { pointer-events: auto; background: rgba(5, 10, 25, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(0, 255, 255, 0.2); }

        /* HUD Panels */
        #hud-left { position: absolute; top: 100px; left: 30px; padding: 20px; border-l-4 border-cyan-500; }
        #info-panel { 
            position: absolute; top: 100px; right: 30px; width: 320px; padding: 25px; 
            border-r-4 border-fuchsia-500; display: none; flex-direction: column;
        }

        .stat-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--neon-cyan); letter-spacing: 2px; opacity: 0.7; }
        .planet-name { font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900; letter-spacing: 2px; }
        .stat-row { display: flex; justify-content: space-between; font-family: 'Share Tech Mono', monospace; font-size: 12px; margin-top: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px; }
        
        .action-btn {
            background: rgba(0, 255, 255, 0.05); border: 1px solid rgba(0, 255, 255, 0.3);
            color: var(--neon-cyan); padding: 10px; cursor: pointer; font-family: 'Share Tech Mono', monospace;
            font-size: 11px; text-transform: uppercase; transition: 0.3s; width: 100%; margin-top: 20px;
        }
        .action-btn:hover { background: var(--neon-cyan); color: black; box-shadow: 0 0 15px var(--neon-cyan); }

        #controls-hint {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 12px 25px; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #666;
        }
        #controls-hint span { color: var(--neon-magenta); }

        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>

    <script src="nav.js"></script>

    <div id="ui-overlay">
        <div id="hud-left" class="glass-panel">
            <div class="stat-label uppercase">Orrery Status</div>
            <div class="text-xl font-bold text-white tracking-widest">REALTIME_SIM_v4.2</div>
            <div class="stat-label uppercase mt-4">Astrodynamics</div>
            <div class="text-xs font-mono text-cyan-400">KEPLERIAN_SOLVER: ON</div>
        </div>

        <div id="info-panel" class="glass-panel">
            <div class="stat-label uppercase">Celestial Object Data</div>
            <div id="p-name" class="planet-name text-white">EARTH</div>
            <div class="stat-row"><span class="text-gray-500">VELOCITY</span><span id="p-vel" class="text-fuchsia-500">29.8 km/s</span></div>
            <div class="stat-row"><span class="text-gray-500">DIAMETER</span><span id="p-dia" class="text-fuchsia-500">12,742 km</span></div>
            <div class="stat-row"><span class="text-gray-500">GRAVITY</span><span id="p-grav" class="text-fuchsia-500">9.81 m/s²</span></div>
            <div id="p-desc" class="text-xs text-gray-400 mt-4 leading-relaxed italic"></div>
            <button class="action-btn" onclick="resetCamera()">RESET_VIEWPORT</button>
        </div>

        <div id="controls-hint" class="glass-panel">
            [SYS] <span>CLICK_PLANET</span> TO SEQUENCE SCAN &bull; <span>DRAG</span> TO ORBIT VIEW
        </div>
    </div>

    <script>
        const PLANET_DATA = [
            { name: "Mercury", size: 1.6, dist: 28, speed: 0.04, color: 0xaaaaaa, desc: "The smallest planet and closest to the Sun. It has a cratered surface and no atmosphere.", dia: "4,879 km", grav: "3.7 m/s²", vel: "47.4 km/s" },
            { name: "Venus", size: 3.6, dist: 45, speed: 0.015, color: 0xffcc99, desc: "Earth's twin. It has a thick, toxic atmosphere that traps heat in a runaway greenhouse effect.", dia: "12,104 km", grav: "8.87 m/s²", vel: "35.0 km/s" },
            { name: "Earth", size: 3.8, dist: 65, speed: 0.01, color: 0x2255ff, desc: "The only known world to support life. 71% of its surface is covered by liquid water.", dia: "12,742 km", grav: "9.81 m/s²", vel: "29.8 km/s" },
            { name: "Mars", size: 2.4, dist: 85, speed: 0.008, color: 0xff4422, desc: "The Red Planet. Home to Olympus Mons, the tallest mountain in the solar system.", dia: "6,779 km", grav: "3.71 m/s²", vel: "24.1 km/s" },
            { name: "Jupiter", size: 10, dist: 130, speed: 0.004, color: 0xdda088, desc: "A gas giant twice as massive as all other planets combined. Famous for its Great Red Spot.", dia: "139,820 km", grav: "24.79 m/s²", vel: "13.1 km/s" },
            { name: "Saturn", size: 8.5, dist: 175, speed: 0.002, color: 0xead6b0, desc: "Adorned with the most spectacular ring system in the known universe.", dia: "116,460 km", grav: "10.44 m/s²", vel: "9.7 km/s", hasRings: true },
            { name: "Uranus", size: 5.5, dist: 220, speed: 0.0015, color: 0xaaffff, desc: "An ice giant that rotates at a nearly 90-degree angle from the plane of its orbit.", dia: "50,724 km", grav: "8.69 m/s²", vel: "6.8 km/s" },
            { name: "Neptune", size: 5.5, dist: 260, speed: 0.001, color: 0x4466ff, desc: "Dark, cold, and whipped by supersonic winds. The most distant major planet.", dia: "49,244 km", grav: "11.15 m/s²", vel: "5.4 km/s" }
        ];

        let scene, camera, renderer, clock, sun, planets = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let focusedPlanet = null;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000003);
            scene.fog = new THREE.FogExp2(0x000003, 0.0015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
            camera.position.set(0, 400, 600);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // Lighting
            const sunLight = new THREE.PointLight(0xffffff, 2, 1500);
            scene.add(sunLight);
            scene.add(new THREE.AmbientLight(0x222222));

            // Sun Construction
            const sunGeo = new THREE.SphereGeometry(18, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            sun = new THREE.Mesh(sunGeo, sunMat);
            scene.add(sun);

            // Sun Bloom Glow
            const glow = new THREE.Mesh(
                new THREE.SphereGeometry(22, 32, 32),
                new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.2 })
            );
            scene.add(glow);

            createStars();
            createPlanets();

            window.addEventListener('mousedown', onPointerDown);
            window.addEventListener('resize', onResize);
            animate();
        }

        function createStars() {
            const geo = new THREE.BufferGeometry();
            const count = 5000;
            const pos = new Float32Array(count * 3);
            for(let i=0; i<count*3; i++) pos[i] = (Math.random() - 0.5) * 3000;
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, transparent: true, opacity: 0.8 });
            scene.add(new THREE.Points(geo, starMat));
        }

        function createPlanets() {
            PLANET_DATA.forEach(data => {
                const orbitGroup = new THREE.Group();
                scene.add(orbitGroup);

                // Orbit Line
                const ring = new THREE.Mesh(
                    new THREE.RingGeometry(data.dist - 0.1, data.dist + 0.1, 128),
                    new THREE.MeshBasicMaterial({ color: 0x333344, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })
                );
                ring.rotation.x = Math.PI / 2;
                scene.add(ring);

                // Planet Body
                const mesh = new THREE.Mesh(
                    new THREE.SphereGeometry(data.size, 32, 32),
                    new THREE.MeshStandardMaterial({ color: data.color, emissive: data.color, emissiveIntensity: 0.1 })
                );
                mesh.position.x = data.dist;
                mesh.userData = { data: data };
                orbitGroup.add(mesh);

                if(data.hasRings) {
                    const r = new THREE.Mesh(
                        new THREE.RingGeometry(data.size * 1.4, data.size * 2.2, 64),
                        new THREE.MeshBasicMaterial({ color: 0x888877, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })
                    );
                    r.rotation.x = Math.PI / 2.3;
                    mesh.add(r);
                }

                planets.push({ orbitGroup, mesh, data, angle: Math.random() * Math.PI * 2 });
            });
        }

        function onPointerDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(planets.map(p => p.mesh));

            if (hits.length > 0) {
                const p = planets.find(pl => pl.mesh === hits[0].object);
                focusedPlanet = p;
                document.getElementById('info-panel').style.display = 'flex';
                document.getElementById('p-name').innerText = p.data.name;
                document.getElementById('p-name').style.color = '#' + p.data.color.toString(16);
                document.getElementById('p-vel').innerText = p.data.vel;
                document.getElementById('p-dia').innerText = p.data.dia;
                document.getElementById('p-grav').innerText = p.data.grav;
                document.getElementById('p-desc').innerText = p.data.desc;
            }
        }

        function resetCamera() {
            focusedPlanet = null;
            document.getElementById('info-panel').style.display = 'none';
            new TWEEN.Tween(camera.position).to({ x: 0, y: 400, z: 600 }, 1200).easing(TWEEN.Easing.Cubic.Out).start();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);
            
            planets.forEach(p => {
                p.angle += p.data.speed;
                p.orbitGroup.rotation.y = p.angle;
                p.mesh.rotation.y += 0.01;
            });

            if (focusedPlanet) {
                const targetPos = new THREE.Vector3();
                focusedPlanet.mesh.getWorldPosition(targetPos);
                const offset = new THREE.Vector3(0, focusedPlanet.data.size * 4, focusedPlanet.data.size * 8);
                camera.position.lerp(targetPos.clone().add(offset), 0.05);
                camera.lookAt(targetPos);
            } else {
                const t = time * 0.00005;
                camera.position.x = Math.sin(t) * 600;
                camera.position.z = Math.cos(t) * 600;
                camera.lookAt(0, 0, 0);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
