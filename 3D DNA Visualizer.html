<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Visualizer | Cyber Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@300;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
            --neon-green: #00ff00;
            --neon-yellow: #ffff00;
        }

        body { margin: 0; overflow: hidden; background: #010105; font-family: 'Rajdhani', sans-serif; color: white; }

        #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .glass-panel { pointer-events: auto; background: rgba(5, 10, 25, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0, 255, 255, 0.2); }

        /* HUD Panels */
        #hud-left { position: absolute; top: 100px; left: 30px; padding: 20px; border-l-4 border-cyan-500; }
        #data-readout { position: absolute; top: 100px; right: 30px; width: 320px; padding: 25px; border-r-4 border-fuchsia-500; }

        .stat-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--neon-cyan); letter-spacing: 2px; opacity: 0.7; }
        .readout-header { font-family: 'Orbitron', sans-serif; font-size: 14px; color: var(--neon-cyan); letter-spacing: 2px; border-bottom: 1px solid rgba(0, 255, 255, 0.1); padding-bottom: 10px; margin-bottom: 15px; }
        
        .base-name { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; line-height: 1; margin-bottom: 5px; }
        .base-pair { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--neon-magenta); text-transform: uppercase; }
        .base-desc { font-size: 13px; color: #aaa; line-height: 1.5; margin-top: 15px; border-t: 1px solid rgba(255, 255, 255, 0.05); pt-4; }

        /* Legend & Interaction */
        #legend { position: absolute; bottom: 30px; left: 30px; padding: 15px 20px; }
        .legend-item { display: flex; align-items: center; gap: 10px; font-family: 'Share Tech Mono', monospace; font-size: 11px; margin-bottom: 4px; }
        .dot { width: 10px; height: 10px; border-radius: 2px; box-shadow: 0 0 10px currentColor; }

        #status-tip { position: absolute; bottom: 30px; right: 30px; padding: 10px 20px; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #555; }
        #status-tip span { color: var(--neon-cyan); }

        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>

    <script src="nav.js"></script>

    <div id="ui-overlay">
        <div id="hud-left" class="glass-panel">
            <div class="stat-label uppercase">Sequence Status</div>
            <div class="text-xl font-bold text-white tracking-widest">ANALYSIS_ACTIVE</div>
            <div class="stat-label uppercase mt-4">Buffer Depth</div>
            <div class="text-xs font-mono text-cyan-400">0.003ms INTERPOLATION</div>
        </div>

        <div id="data-readout" class="glass-panel">
            <div class="readout-header">GENOME_READOUT</div>
            <div id="default-msg" class="text-gray-500 italic text-sm">Target individual nucleobase for structural breakdown...</div>
            <div id="base-data" style="display: none;">
                <div id="active-name" class="base-name">ADENINE</div>
                <div id="active-pair" class="base-pair">PAIRS WITH THYMINE</div>
                <div id="active-desc" class="base-desc">A purine derivative...</div>
            </div>
        </div>

        <div id="legend" class="glass-panel">
            <div class="legend-item"><div class="dot" style="color: var(--neon-green); background: var(--neon-green);"></div> Adenine (A)</div>
            <div class="legend-item"><div class="dot" style="color: var(--neon-yellow); background: var(--neon-yellow);"></div> Thymine (T)</div>
            <div class="legend-item"><div class="dot" style="color: var(--neon-cyan); background: var(--neon-cyan);"></div> Cytosine (C)</div>
            <div class="legend-item"><div class="dot" style="color: var(--neon-magenta); background: var(--neon-magenta);"></div> Guanine (G)</div>
        </div>

        <div id="status-tip" class="glass-panel">
            [SCANNER] <span>MOUSE_OVER</span> TO SEQUENCE &bull; <span>DRAG</span> TO ROTATE HELIX
        </div>
    </div>

    <script>
        const BASE_DATA = {
            'A': { name: 'ADENINE', pair: 'PAIRS WITH THYMINE', color: 0x00ff00, desc: 'A purine derivative and one of the four constituent bases of nucleic acids. Adenine binds to thymine via two hydrogen bonds.' },
            'T': { name: 'THYMINE', pair: 'PAIRS WITH ADENINE', color: 0xffff00, desc: 'A pyrimidine nucleobase. Known as 5-methyluracil, it is the primary partner for Adenine in DNA structures.' },
            'C': { name: 'CYTOSINE', pair: 'PAIRS WITH GUANINE', color: 0x00ffff, desc: 'A pyrimidine derivative. In DNA and RNA, cytosine pairs with guanine, forming three hydrogen bonds.' },
            'G': { name: 'GUANINE', pair: 'PAIRS WITH CYTOSINE', color: 0xff00ff, desc: 'A purine derivative used to build nucleic acids. Guanine is the essential structural counterpart to Cytosine.' }
        };

        let scene, camera, renderer, clock, helixGroup;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let hoveredObject = null;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x010108);
            scene.fog = new THREE.FogExp2(0x010108, 0.008);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 90);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            scene.add(new THREE.AmbientLight(0x222222));
            const pLight = new THREE.PointLight(0x00ffff, 1.2, 200);
            pLight.position.set(30, 30, 50);
            scene.add(pLight);

            createDNA();

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onResize);
            animate();
        }

        function createDNA() {
            helixGroup = new THREE.Group();
            scene.add(helixGroup);

            const numPairs = 35;
            const helixRadius = 12;
            const heightStep = 3.5;
            const rotationStep = 0.35;

            const sphereGeo = new THREE.IcosahedronGeometry(0.9, 2);
            const rodGeo = new THREE.CylinderGeometry(0.1, 0.1, helixRadius * 2);

            for (let i = 0; i < numPairs; i++) {
                const angle = i * rotationStep;
                const y = (i - numPairs / 2) * heightStep;

                // Position calculation
                const x1 = Math.cos(angle) * helixRadius;
                const z1 = Math.sin(angle) * helixRadius;
                const x2 = Math.cos(angle + Math.PI) * helixRadius;
                const z2 = Math.sin(angle + Math.PI) * helixRadius;

                const baseTypes = Math.random() > 0.5 ? ['A', 'T'] : ['C', 'G'];
                if(Math.random() > 0.5) baseTypes.reverse();

                // Base 1
                const b1 = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({ 
                    color: BASE_DATA[baseTypes[0]].color, 
                    emissive: BASE_DATA[baseTypes[0]].color, 
                    emissiveIntensity: 0.6 
                }));
                b1.position.set(x1, y, z1);
                b1.userData = { type: 'base', baseId: baseTypes[0] };
                helixGroup.add(b1);

                // Base 2
                const b2 = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({ 
                    color: BASE_DATA[baseTypes[1]].color, 
                    emissive: BASE_DATA[baseTypes[1]].color, 
                    emissiveIntensity: 0.6 
                }));
                b2.position.set(x2, y, z2);
                b2.userData = { type: 'base', baseId: baseTypes[1] };
                helixGroup.add(b2);

                // Connector
                const rod = new THREE.Mesh(rodGeo, new THREE.MeshBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.4 }));
                rod.position.set(0, y, 0);
                rod.rotation.z = Math.PI / 2;
                rod.rotation.y = -angle;
                helixGroup.add(rod);
            }
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(helixGroup.children);

            if (intersects.length > 0) {
                const obj = intersects[0].object;
                if (obj.userData.type === 'base' && hoveredObject !== obj) {
                    if (hoveredObject) hoveredObject.material.emissiveIntensity = 0.6;
                    hoveredObject = obj;
                    hoveredObject.material.emissiveIntensity = 3.0;
                    updateReadout(obj.userData.baseId);
                }
            } else if (hoveredObject) {
                hoveredObject.material.emissiveIntensity = 0.6;
                hoveredObject = null;
                clearReadout();
            }
        }

        function updateReadout(id) {
            const data = BASE_DATA[id];
            document.getElementById('default-msg').style.display = 'none';
            document.getElementById('base-data').style.display = 'block';
            const nameEl = document.getElementById('active-name');
            nameEl.innerText = data.name;
            nameEl.style.color = '#' + data.color.toString(16).padStart(6, '0');
            nameEl.style.textShadow = `0 0 20px #${data.color.toString(16).padStart(6, '0')}`;
            document.getElementById('active-pair').innerText = data.pair;
            document.getElementById('active-desc').innerText = data.desc;
        }

        function clearReadout() {
            document.getElementById('default-msg').style.display = 'block';
            document.getElementById('base-data').style.display = 'none';
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            helixGroup.rotation.y += 0.006;
            helixGroup.position.y = Math.sin(time * 0.4) * 3;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
