        header {

        }

        .nav-links {

            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* Hero Section */
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 10%;
        }

        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 3px solid #00d4ff;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

            gap: 50px;
            flex-wrap: wrap;
            padding: 50px 0;
            background: rgba(0,0,0,0.5);
        }

        .logos img, .logo-text {
            height: 50px;
            filter: grayscale(1) brightness(2) opacity(0.6);
        }
    </style>
