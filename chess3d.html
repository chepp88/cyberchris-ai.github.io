<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Chess | Cyber Matrix Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f5d4;
            --neon-magenta: #ff00f5;
            --dark-bg: #0a0a0f;
            --panel-bg: rgba(10, 10, 15, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--dark-bg);
            color: #fff;
            overflow: hidden;
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 245, 212, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 245, 212, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        .particle {
            position: absolute; width: 2px; height: 2px;
            background: var(--neon-cyan); border-radius: 50%;
            animation: float 15s infinite; opacity: 0.6;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh); }
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 245, 212, 0.2);
        }

        .nav-link {
            transition: all 0.3s;
            text-shadow: 0 0 5px rgba(0, 245, 212, 0);
        }

        .nav-link:hover {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .neon-btn {
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-magenta));
            color: #000; font-weight: bold; transition: all 0.3s;
        }

        .neon-btn:hover {
            box-shadow: 0 0 15px var(--neon-cyan);
            transform: translateY(-2px);
        }

        #gameCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
        }

        .ui-layer {
            position: relative; z-index: 10; pointer-events: none;
        }

        .ui-layer * { pointer-events: auto; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="particles" id="particles"></div>

    <nav class="fixed top-0 left-0 w-full z-50 glass-panel border-b border-cyan-500/30">
        <div class="max-w-[1600px] mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <a href="index.html" class="font-orbitron text-2xl font-black bg-gradient-to-r from-cyan-400 to-fuchsia-500 bg-clip-text text-transparent mr-8">
                    CYBER<span class="text-cyan-400">MATRIX</span>
                </a>
                
                <div class="hidden xl:flex items-center gap-4 font-mono text-[10px] overflow-x-auto scrollbar-hide">
                    <a href="index.html" class="nav-link text-gray-400">[HOME]</a>
                    <a href="billiards.html" class="nav-link text-gray-400">[COSMIC_BILLIARDS]</a>
                    <a href="zengarden.html" class="nav-link text-gray-400">[ZEN_GARDEN]</a>
                    <a href="dna.html" class="nav-link text-gray-400">[DNA]</a>
                    <a href="solar.html" class="nav-link text-gray-400">[SOLAR_SYSTEM]</a>
                    <a href="molecule.html" class="nav-link text-gray-400">[MOLECULE]</a>
                    <a href="physics.html" class="nav-link text-gray-400">[PHYSICS]</a>
                    <a href="solitaire3d.html" class="nav-link text-gray-400">[SOLITAIRE]</a>
                    <a href="trippyrun.html" class="nav-link text-gray-400">[TRIPPY_RUN]</a>
                    <a href="planner.html" class="nav-link text-gray-400">[ROOM_PLANNER]</a>
                    <a href="converter.html" class="nav-link text-gray-400">[CONVERTER]</a>
                    <a href="visualizer.html" class="nav-link text-gray-400">[3D_VISUALIZER]</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="ui-layer h-screen pt-24 px-6 flex justify-between items-start">
        <div class="glass-panel p-5 w-72 rounded-sm border-l-4 border-l-cyan-500">
            <h2 class="font-orbitron text-lg font-bold text-cyan-400 mb-4 tracking-widest uppercase">Tactical Chess</h2>
            <div class="space-y-6">
                <div class="border-b border-cyan-500/20 pb-4">
                    <p class="text-[10px] font-mono text-cyan-500/60 uppercase mb-2">System Sequence</p>
                    <div id="turnIndicator" class="font-mono text-sm py-2 px-3 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">WHITE TURN</div>
                </div>
                <button id="resetBtn" class="neon-btn w-full py-2 font-mono text-xs uppercase tracking-tighter">Reload_Matrix</button>
                <div id="moveHistory" class="h-32 overflow-y-auto font-mono text-[10px] space-y-1 text-gray-500 scrollbar-hide"></div>
            </div>
        </div>
    </div>

    <div id="gameCanvas"></div>

    <script>
        // --- Particle System ---
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 40; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particlesContainer.appendChild(particle);
        }

        // --- Three.js Chess Engine ---
        let scene, camera, renderer, controls;
        const pieces = [];

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('gameCanvas').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0x00f5d4, 1);
            pointLight.position.set(5, 10, 5);
            scene.add(pointLight);

            createBoard();
            camera.position.set(0, 8, 10);
            controls.update();
            animate();
        }

        function createBoard() {
            const boardGroup = new THREE.Group();
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const isWhite = (i + j) % 2 === 0;
                    const geometry = new THREE.BoxGeometry(1, 0.2, 1);
                    const material = new THREE.MeshPhongMaterial({
                        color: isWhite ? 0x1a1a2e : 0x0a0a15,
                        emissive: isWhite ? 0x00f5d4 : 0x000000,
                        emissiveIntensity: 0.1,
                        transparent: true,
                        opacity: 0.8
                    });
                    const cube = new THREE.Mesh(geometry, material);
                    cube.position.set(i - 3.5, 0, j - 3.5);
                    boardGroup.add(cube);
                }
            }
            scene.add(boardGroup);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.getElementById('resetBtn').onclick = () => location.reload();

        init();
    </script>
</body>
</html>
