<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Vault | Security Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@300;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon-cyan: #00ffff; --neon-magenta: #ff00ff; }
        body { margin: 0; overflow: hidden; background: #00050a; font-family: 'Rajdhani', sans-serif; color: white; }
        
        #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .glass-panel { pointer-events: auto; background: rgba(2, 8, 15, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(0, 255, 255, 0.3); }

        /* Security HUD */
        #hud-top { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); width: 400px; padding: 10px; text-align: center; border-b-2 border-cyan-500; }
        #log-panel { position: absolute; bottom: 30px; left: 30px; width: 300px; height: 150px; padding: 15px; overflow: hidden; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--neon-cyan); }

        .scanline {
            width: 100%; height: 2px; background: rgba(0, 255, 255, 0.2);
            position: absolute; top: 0; left: 0; animation: scan 4s linear infinite;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        .node-label { font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 2px; }
        .access-granted { color: #00ff00; text-shadow: 0 0 10px #00ff00; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>

    <script src="nav.js"></script>

    <div id="ui-overlay">
        <div id="hud-top" class="glass-panel">
            <div class="scanline"></div>
            <div class="text-[10px] uppercase tracking-[4px] text-cyan-400">Security Clearance: Level 5</div>
            <div id="vault-status" class="node-label text-xl mt-1">VAULT_ENCRYPTED</div>
        </div>

        <div id="log-panel" class="glass-panel">
            <div class="text-[10px] mb-2 border-b border-cyan-900 pb-1">KERNEL_LOG_STREAM</div>
            <div id="log-content"></div>
        </div>

        <div class="absolute bottom-10 right-10 glass-panel p-6 text-right w-64 border-r-4 border-fuchsia-500">
            <div class="text-[10px] text-fuchsia-400 uppercase font-mono">Core Temperature</div>
            <div class="text-2xl font-black">32.4°C</div>
            <div class="text-[10px] text-cyan-400 mt-4 uppercase font-mono">Encryption Matrix</div>
            <div class="text-lg font-bold">AES-256-GCM</div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, clock, coreGroup, nodes = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let unlockedNodes = 0;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000205);
            scene.fog = new THREE.FogExp2(0x00050a, 0.015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // Central Core Group
            coreGroup = new THREE.Group();
            scene.add(coreGroup);

            // Main Core Orb
            const coreGeo = new THREE.IcosahedronGeometry(12, 1);
            const coreMat = new THREE.MeshStandardMaterial({ 
                color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.4 
            });
            const coreOrb = new THREE.Mesh(coreGeo, coreMat);
            coreGroup.add(coreOrb);

            // Inner Core Solid
            const innerCore = new THREE.Mesh(
                new THREE.IcosahedronGeometry(6, 0),
                new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0xff00ff, emissiveIntensity: 2 })
            );
            coreGroup.add(innerCore);

            // Add Security Nodes
            createNodes();

            // Lighting
            const pLight = new THREE.PointLight(0x00ffff, 2, 200);
            pLight.position.set(0, 0, 50);
            scene.add(pLight);
            scene.add(new THREE.AmbientLight(0x111111));

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onResize);
            
            addLog("INITIALIZING SECURITY PROTOCOLS...");
            addLog("ENCRYPTION KEYS GENERATED.");
            animate();
        }

        function createNodes() {
            const nodeGeo = new THREE.BoxGeometry(3, 3, 3);
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const nodeMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.5 });
                const node = new THREE.Mesh(nodeGeo, nodeMat);
                
                node.position.x = Math.cos(angle) * 35;
                node.position.y = Math.sin(angle) * 35;
                node.userData = { id: i, active: false };
                
                scene.add(node);
                nodes.push(node);
            }
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(nodes);

            if (hits.length > 0) {
                const node = hits[0].object;
                if (!node.userData.active) {
                    node.userData.active = true;
                    node.material.color.setHex(0xff00ff);
                    node.material.emissive.setHex(0xff00ff);
                    node.material.emissiveIntensity = 4;
                    unlockedNodes++;
                    addLog(`NODE_${node.userData.id} AUTHENTICATED...`);
                    checkVaultStatus();
                }
            }
        }

        function checkVaultStatus() {
            if (unlockedNodes === 6) {
                const status = document.getElementById('vault-status');
                status.innerText = "ACCESS_GRANTED";
                status.classList.add('access-granted');
                addLog("VAULT DECRYPTED. WELCOME, CHRIS.");
            }
        }

        function addLog(msg) {
            const log = document.getElementById('log-content');
            const entry = document.createElement('div');
            entry.innerText = `> ${msg}`;
            log.prepend(entry);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            coreGroup.rotation.y += 0.01;
            coreGroup.rotation.z += 0.005;
            coreGroup.scale.setScalar(1 + Math.sin(t * 2) * 0.05);

            nodes.forEach((n, i) => {
                const offset = t + i;
                n.rotation.x += 0.02;
                if (!n.userData.active) {
                    n.position.y += Math.sin(offset) * 0.1;
                }
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
