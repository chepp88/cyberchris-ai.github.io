<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade_Terminal_V4 | CyberSolutionsOhio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root { --neon-cyan: #00ffff; --neon-magenta: #ff00ff; --neon-yellow: #ffff00; --neon-green: #00ff00; }
        body { background: #00050a; color: white; font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }

        /* Tactical Grid */
        .arcade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        /* Mini-Cabinet Styling */
        .mini-cabinet {
            background: rgba(10, 20, 40, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            text-decoration: none !important;
        }
        .mini-cabinet:hover {
            border-color: var(--neon-cyan);
            background: rgba(0, 255, 255, 0.05);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.1);
        }

        .node-id { font-family: 'Share Tech Mono'; font-size: 9px; color: #555; }
        .arcade-icon { font-size: 2rem; margin: 15px 0; transition: transform 0.3s ease; }
        .mini-cabinet:hover .arcade-icon { transform: scale(1.2) rotate(5deg); }

        /* Sector Color Coding */
        .sector-combat { border-top: 2px solid var(--neon-magenta); }
        .sector-logic { border-top: 2px solid var(--neon-yellow); }
        .sector-physics { border-top: 2px solid var(--neon-cyan); }
        .sector-util { border-top: 2px solid var(--neon-green); }

        /* CRT Overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px; z-index: 50; pointer-events: none; opacity: 0.3;
        }
    </style>
</head>
<body class="bg-[#00050a]">
    <div class="scanlines"></div>

    <header class="p-8 border-b border-cyan-900/30 bg-black/40 text-center">
        <h1 class="font-['Orbitron'] text-4xl font-black tracking-widest uppercase">
            Simulation<span class="text-cyan-400">_Floor</span>
        </h1>
        <div class="font-['Share_Tech_Mono'] text-[10px] text-cyan-700 mt-2 tracking-[8px]">
            TOTAL_NODES: 20 // SYSTEM_STATUS: STABLE
        </div>
    </header>

    <div class="max-w-[1600px] mx-auto">
        <div class="arcade-grid" id="main-floor">
            </div>
    </div>

    <script>
        const nodes = [
            { id: "01", name: "3D_PONG", icon: "🏓", sector: "physics", link: "3d-pong.html" },
            { id: "02", name: "ASTEROIDS", icon: "🚀", sector: "combat", link: "3d-asteroid-field.html" },
            { id: "03", name: "SOLITAIRE", icon: "🃏", sector: "logic", link: "solitaire.html" },
            { id: "04", name: "MAZE_RUNNER", icon: "🌀", sector: "physics", link: "Momentum-runner.html" },
            { id: "05", name: "CITY_BUILD", icon: "🏙️", sector: "util", link: "city-builder.html" },
            { id: "06", name: "DNA_VIS", icon: "🧬", sector: "util", link: "dna.html" },
            { id: "07", name: "SOLAR_SYS", icon: "☀️", sector: "util", link: "solar.html" },
            { id: "08", name: "VAULT_SEC", icon: "🔐", sector: "combat", link: "vault.html" },
            { id: "09", name: "ZEN_GARDEN", icon: "🎍", sector: "logic", link: "zengarden.html" },
            { id: "10", name: "BILLIARDS", icon: "🎱", sector: "physics", link: "billiards.html" },
            { id: "11", name: "BLOCK_BREAK", icon: "🧱", sector: "physics", link: "breakout.html" },
            { id: "12", name: "HEX_GLITCH", icon: "👾", sector: "combat", link: "glitch.html" },
            { id: "13", name: "DATA_STRE", icon: "📉", sector: "util", link: "datastream.html" },
            { id: "14", name: "NEURAL_NET", icon: "🧠", sector: "logic", link: "neural.html" },
            { id: "15", name: "VOID_WALK", icon: "🚶", sector: "physics", link: "voidwalker.html" },
            { id: "16", name: "TETRA_LOGIC", icon: "🔳", sector: "logic", link: "tetra.html" },
            { id: "17", name: "MATRIX_RAIN", icon: "🌧️", sector: "util", link: "matrix.html" },
            { id: "18", name: "CORE_MELT", icon: "☢️", sector: "combat", link: "coremelt.html" },
            { id: "19", name: "ORBIT_SIM", icon: "🛰️", sector: "physics", link: "orbit.html" },
            { id: "20", name: "ROOT_ACCESS", icon: "⌨️", sector: "combat", link: "root.html" }
        ];

        const floor = document.getElementById('main-floor');

        nodes.forEach(node => {
            const card = document.createElement('a');
            card.href = node.link;
            card.className = `mini-cabinet sector-${node.sector} p-4 flex flex-col items-center text-center`;
            card.innerHTML = `
                <div class="w-full flex justify-between node-id">
                    <span>NODE_${node.id}</span>
                    <span>${node.sector.toUpperCase()}</span>
                </div>
                <div class="arcade-icon">${node.icon}</div>
                <div class="font-['Orbitron'] text-sm tracking-tighter text-white group-hover:text-cyan-400">
                    ${node.name}
                </div>
                <div class="mt-3 w-full bg-white/5 h-[1px]"></div>
                <div class="mt-2 text-[8px] text-gray-500 font-['Share_Tech_Mono'] uppercase">Initialize_Sequence</div>
            `;
            floor.appendChild(card);
        });
    </script>
</body>
</html>
